<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quick Note Taker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:900px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:400px;
    border:none;
    outline:none;
    resize:none;
    border-radius:15px;
    padding:20px;
    font-size:18px;
    background:rgba(255,255,255,0.9);
}

.button-group{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    background:white;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
}

#status{
    margin-top:15px;
    color:white;
    font-size:16px;
}

#stats{
    margin-top:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#login-screen{
    width:500px;
    text-align:center;
}

#login-screen h2{
    color:white;
    margin-bottom:20px;
}

#password-input{
    padding:12px;
    width:220px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

#login-message{
    margin-top:10px;
    color:#ffcccc;
}

</style>

</head>

<body>

<!-- Login Screen -->

<div id="login-screen" class="container">

    <h2>🔒 Note Locker</h2>

    <input
        type="password"
        id="password-input"
        placeholder="Enter Password">

    <button id="login-btn">Login</button>

    <p id="login-message"></p>

</div>

<!-- Main App -->

<div id="app-content" style="display:none;">

<div class="container">

<h1>📝 Quick Note Taker</h1>

<textarea id="note" placeholder="Start typing your note..."></textarea>

<div id="stats">
Words: 0 | Characters: 0
</div>

<div class="button-group">

<button id="new-note">🆕 New Note</button>
<button id="open">📂 Open File</button>
<button id="save">💾 Save Note</button>
<button id="save-as">📁 Save As</button>
<button id="font-increase">🔍 A+</button>
<button id="font-decrease">🔍 A-</button>
<button id="dark-mode-toggle">🌙 Dark Mode</button>
<button id="trash-note">🗑️ Trash</button>
<button id="restore-note">♻️ Restore</button>
<button id="empty-trash">❌ Empty Trash</button>

</div>

<div id="status"></div>

</div>

</div>

<script src="renderer.js"></script>

</body>
</html>
